{%- assign page_desc = page.description | default: site.description -%}
<meta property="og:site_name" content="SLING AI Inc.">
<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}SLING AI Inc.">
<meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/company_logo.png' | absolute_url }}">
<meta name="twitter:card" content="summary">
<script>
  // Open every off-site link in a new tab (covers Markdown links and theme
  // aux links). Links that already declare a target are left alone.
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('a[href^="http"]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      if (a.hostname === window.location.hostname || a.hasAttribute('target')) continue;
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  });
</script>
