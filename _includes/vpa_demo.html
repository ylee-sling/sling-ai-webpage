{%- assign vpa = site.data.vpa -%}
<section id="demo">
  <h2>VPA in action: rollouts from the LIBERO-10 benchmark</h2>
  <div class="demos">
    {%- for d in vpa.demos %}
    <figure class="demo">
      <div class="demo__frame">
        <video src="{{ d.video | relative_url }}" poster="{{ d.poster | relative_url }}" width="1024" height="512"
               autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="VPA robot rollout: {{ d.task }}"></video>
        <button class="media-toggle" type="button" data-video-toggle data-pause="Pause video" data-play="Play video" aria-label="Pause video"></button>
      </div>
      <figcaption>{{ d.task }}</figcaption>
    </figure>
    {%- endfor %}
  </div>
  <p class="figures-note">
    Two-camera VPA policy in the LIBERO simulator, played at 2× speed. Left: room camera; right: wrist camera.
    <a href="{{ site.data.links.vpa_results }}">More rollouts and per-task results on GitHub</a>.
  </p>
</section>
