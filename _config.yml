# ---------------------------------------------------------------------------
# SLING AI Inc. website — https://sling.ai.kr
#
# Content lives in _data/:
#   _data/home/en.yml   English home page (all text)
#   _data/home/ko.yml   Korean home page (/ko/)
#   _data/links.yml     every external link (models, code, papers, patent)
#   _data/company.yml   legal name, registration numbers, address, contact
#   _data/vpa.yml       numbers on the VPA technical page
#   _data/aero.yml      numbers on the Aero-VPA technical page
# Change text there; the templates in _layouts/ and _includes/ pick it up.
# ---------------------------------------------------------------------------

title: "SLING AI"
tagline: "Symbolic Logic Inspires Normal and General AI"
description: >-
  SLING AI Inc. builds VPA (Vision-Predictor-Action), lightweight AI control
  software that lets robot arms and drones see, predict and move on low-power
  edge hardware, without a large language model in the loop.
lang: en

# The site is served from the custom domain set in the repository's
# GitHub Pages settings. Absolute URLs (canonical, Open Graph, sitemap)
# are built from this value.
url: "https://sling.ai.kr"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: en
