status_badge: "Status: Proven Working MVP (Benchmarked & Open-Source Verified)"

mission: >-
  Bringing mathematical safety and reliability to generative AI models
  operating in critical physical systems.

headline: >-
  Real-Time, Hesitation-Free Robot Intelligence Powered by
  Vision-Predictor-Action (VPA).

links:
  arxiv: "https://arxiv.org/abs/2610.15556"
  github: "https://github.com/ylee-sling/Vision-Predictor-Action"
  huggingface: "https://huggingface.co/ylee-sling/vpa-libero10"

paper:
  title: "Vision-Predictor-Action: Towards Efficient Embodied AI via Neuro-Symbolic JEPA Predictors"
  date: "October 2026"
  arxiv_id: "2610.15556"

metrics:
  - value: "10–14 ms"
    label: "Latency per decision step"
    detail: "≈ 70–100 Hz real-time control. Measured on an Apple M4 edge SoC (single-camera reference configuration)."
  - value: "40.0%"
    label: "LIBERO-10 success rate"
    detail: "Two-camera policy, 80 / 200 episodes (95% CI 33.5–46.9%). Preliminary: single training run."
  - value: "< 20M"
    label: "Trainable parameters"
    detail: "Checkpoint under 75 MB. Trained in under 3 hours on a single GPU."
  - value: "100%"
    label: "Publicly reproducible"
    detail: "Paper, code, and weights (PyTorch + safetensors, GPL-3.0) are all public."

