# ---------------------------------------------------------------------------
# VPA (Vision-Predictor-Action) for robot arms: numbers on /solutions_vpa.html.
# Every figure is taken from the preprint, the GitHub README or the Hugging Face
# model card. Change numbers HERE, not in the templates. Links: _data/links.yml.
# ---------------------------------------------------------------------------

status: >-
  Research prototype tested in simulation. The paper, code and trained weights are public;
  tests on a real robot arm are planned for the first half of 2027.

paper:
  title: "Vision-Predictor-Action: Towards Efficient Embodied AI via Neuro-Symbolic JEPA Predictors"
  date: "October 2026"
  arxiv_id: "2610.15556"

metrics:
  - label: "Time per decision"
    value: "10–14 ms"
    detail: "About 70–100 decisions per second. Latency benchmark on an Apple M4 chip (single-camera configuration)."
  - label: "LIBERO-10 success rate"
    value: "40.0%"
    detail: "Two-camera policy, 80 of 200 episodes (95% CI 33.5–46.9%). One camera: 10.5%. Preliminary: one training run per setting."
  - label: "Trainable parameters"
    value: "Under 20 million"
    detail: "Checkpoint under 75 MB. Trained in under 3 hours on a single GPU."
  - label: "Network calls per decision"
    value: "K + 3"
    detail: "Five calls with the default K = 2 solver steps, whatever the length of the action chunk."
  - label: "Openness"
    value: "Fully public"
    detail: "Paper, code and weights (PyTorch and safetensors, GPL-3.0)."

