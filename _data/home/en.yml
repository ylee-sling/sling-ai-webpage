hero:
  title: "One lightweight AI brain for robot arms and drones"
  lede: >-
    SLING AI builds <strong>VPA (Vision-Predictor-Action)</strong>, control software that lets a
    machine look through its camera, predict the next moment and move, with no large language
    model in the loop. The same design steers a robot arm and a drone, and at about 70&nbsp;MB it
    runs on the machine's own low-power board instead of a costly GPU.
  primary: { label: "See how VPA works", href: "#how" }
  secondary: { label: "Contact us", subject: "SLING AI inquiry" }
  links:
    - { label: "Open models on Hugging Face", key: "huggingface" }
    - { label: "Source code on GitHub", key: "github" }
  status_label: "Where we are"
  status: >-
    Working software in simulation, released openly as models, code and data. Tests on a real
    robot arm and a real drone begin in the first half of 2027.
  figure:
    label: "VPA control loop: one model drives both a robot arm and a drone"
    brain: "One VPA brain"
    stages:
      - { name: "Vision", verb: "sees" }
      - { name: "Predictor", verb: "predicts" }
      - { name: "Action", verb: "moves" }
    note: "About 70 MB. Runs inside the device, no costly GPU."
    chunk: "16 actions per decision"
    arm: { name: "Robot arm", model: "VPA" }
    drone: { name: "Drone", model: "Aero-VPA" }

glance:
  id: "glance"
  title: "SLING AI at a glance"
  intro: "What we sell, to whom, and how far along we are."
  rows:
    - k: "What we build"
      v: >-
        AI control software for physical machines. VPA turns camera images into the machine's
        next 16 movements: joint commands for a robot arm (<strong>VPA</strong>) or speed and
        heading commands for a drone (<strong>Aero-VPA</strong>).
    - k: "Who it is for"
      v: >-
        Factories, logistics centers and drone operators that need machines to react quickly;
        robot, drone and chip makers that want a small AI brain to ship inside their products.
    - k: "How we make money"
      v: >-
        On-site software: a paid proof of concept, then an annual subscription priced at 20% of
        the labor cost it saves. Technology licensing: a royalty for every product shipped with
        VPA inside.
    - k: "Stage"
      v: >-
        Working MVP in simulation, with models, code and benchmark data public. Pre-revenue;
        first revenue planned for 2027.
    - k: "Validation"
      v: >-
        KRW 200 million credit guarantee from Korea Credit Guarantee Fund (KODIT), October 2026.
        One registered Korean patent.
    - k: "Company"
      v: >-
        SLING AI Inc., founded February 2026 in Incheon, Republic of Korea. Founder and CEO:
        Dr. Yeonseok Lee.

problem:
  id: "problem"
  title: "Robot AI today is heavy, slow and built one machine at a time"
  intro: >-
    Most new robot models first turn what the camera sees into language, then reason with a
    large language model (LLM) before they move.
  points:
    - title: "A huge brain"
      text: "LLM-based robot AI carries 4 GB or more of weights and needs an expensive GPU."
    - title: "Slow reactions"
      text: "It computes its answer one word at a time, so it responds late when an obstacle suddenly appears."
    - title: "A separate AI for every machine"
      text: "Robot arms and drones each get their own AI, and a drone can rarely carry a large model at all."
  flow:
    - { name: "Camera", lines: ["Sees"] }
    - { name: "LLM, 4 GB+", lines: ["Needs an expensive GPU", "Computes one word at a time"], note: "This is where it slows down", slow: true }
    - { name: "Robot or drone", lines: ["Moves"], note: "Reacts late" }
  flow_label: "The usual pipeline: camera, then a large language model, then the machine"
  caption: "In the usual pipeline, turning what the machine sees into words is the heavy, slow step."
  verdict: "Slow, heavy and fragmented: this is what keeps robots and drones out of everyday field work."

how:
  id: "how"
  title: "How VPA works: see, predict, move"
  intro: >-
    VPA drops the language step. Four small networks run in a row, and the last one writes the
    whole next stretch of motion in a single pass.
  input: { name: "Camera", sub: "Same input for robot arms and drones" }
  steps:
    - { mark: "V", name: "See", term: "Vision", text: "Keeps only what matters in the image" }
    - { mark: "", name: "Choose", term: "Skill selector", text: "Picks what to do next" }
    - { mark: "P", name: "Preview", term: "Predictor", text: "Predicts the scene 0.1 s ahead" }
    - { mark: "A", name: "Move", term: "Action", text: "Writes 16 actions at once" }
  output: { title: "Next 16 actions in 0.012 s", sub: "Robot-arm joints or drone flight" }
  bracket: "No language step: 5 network calls plan the whole continuous motion."
  spec_title: "Key numbers"
  spec:
    - k: "Time to plan the next 16 actions"
      v: "12 ms, about a tenth of a blink"
      note: "VPA measured on an Apple M4 chip"
    - k: "Model size"
      v: "About 70 MB, roughly the size of 15 songs"
      note: "18.13 million parameters (Aero-VPA)"
    - k: "Compared with a 4 GB LLM-based robot AI"
      v: "About 1/50 the size"
    - k: "Network calls per decision"
      v: "Always 5, however long the motion"
    - k: "Where it runs"
      v: "On the machine's own low-power board"
      note: "Aero-VPA is designed for the 15 W NVIDIA Jetson Orin Nano"
    - k: "Where we train it"
      v: "Google Cloud GPU virtual machines (NVIDIA L4)"
      note: "The drone flight simulation (PX4 and Gazebo) runs there too"
  example:
    title: "Example: a drone flying through a forest to its goal"
    rows:
      - { k: "1. See (V)", v: "The camera locates the trees ahead." }
      - { k: "2. Choose", v: "It picks “avoid the trees and keep moving forward”." }
      - { k: "3. Preview (P)", v: "It predicts the next 0.1 s to spot where it could hit something." }
      - { k: "4. Move (A)", v: "It sends 16 speed and heading commands at once." }
      - { k: "Safety shield", v: "It remembers passed trees for 15 s, and slows down or backs off when it gets too close.", safe: true }
  footnote: >-
    70 MB refers to Aero-VPA's 18.13 million parameters stored at full precision. VPA for robot
    arms is the same size class, under 20 million parameters.

