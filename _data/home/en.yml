compare:
  id: "compare"
  title: "How VPA compares"
  intro: >-
    Robot AI today either runs a large language model or, for drones, builds a map before it can
    plan. VPA does neither.
  head: ["Approach", "Model size (parameters)", "Hardware needed", "How it produces motion", "Used for"]
  rows:
    - { name: "Large robot AI", ex: "Google and other big-tech labs; LLM-based", size: "3.3 billion to 55 billion", hw: "High-end GPU", method: "Turns what it sees into words, then reasons", use: "Robot arms" }
    - { name: "Small robot AI", ex: "Open small models; LLM-based", size: "About 450 million", hw: "Standard GPU or PC", method: "Turns what it sees into words, then reasons", use: "Robot arms" }
    - { name: "Map-based autonomous flight", ex: "Traditional approach: builds a map first", size: "Not applicable", hw: "Several sensors", method: "Builds a map, then computes a route", use: "Drones" }
  ours: { name: "SLING AI", ex: "VPA and Aero-VPA", size: "About 18 million", hw: "Low-power edge board", method: "5 network calls, straight to motion", use: "Robot arms and drones, same architecture" }
  points:
    - { title: "Ultra-light", text: "1/100 the size of large robot AI, or smaller." }
    - { title: "Fast reactions", text: "Every decision takes exactly 5 network calls." }
    - { title: "One brain, two bodies", text: "The same architecture controls robot arms and drones." }
    - { title: "Safety built in", text: "The safety shield cut drone crashes from 72% to 22%." }
  footnote: >-
    Model size is the number of parameters reported in public papers: Google RT-2 up to 55 billion,
    OpenVLA 7 billion, π0 3.3 billion, SmolVLA 450 million.

