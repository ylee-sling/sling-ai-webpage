hero:
  title: "로봇도, 드론도 움직이는 하나의 AI 두뇌"
  lede: >-
    슬링에이아이는 <strong>VPA(Vision-Predictor-Action)</strong>를 만듭니다. 카메라로 보고, 다음 순간을
    예측하고, 바로 움직이는 로봇 제어 AI입니다. 중간에 거대 언어모델(LLM)을 거치지 않습니다. 같은
    구조로 로봇팔과 드론을 모두 제어하며, 크기가 약 70&nbsp;MB라 고가 GPU 없이 기기 안의 저전력
    보드에서 작동합니다.
  primary: { label: "작동 원리 보기", href: "#how" }
  secondary: { label: "문의하기", subject: "슬링에이아이 문의" }
  links:
    - { label: "Hugging Face 공개 모델", key: "huggingface" }
    - { label: "GitHub 공개 코드", key: "github" }
  status_label: "현재 단계"
  status: >-
    시뮬레이션에서 작동을 검증했고, 모델·코드·데이터를 모두 공개했습니다. 실물 로봇팔·드론 시험은
    2027년 상반기에 시작합니다.
  figure:
    label: "VPA 제어 흐름: 하나의 모델이 로봇팔과 드론을 모두 움직임"
    brain: "하나의 VPA 두뇌"
    stages:
      - { name: "Vision", verb: "보기" }
      - { name: "Predictor", verb: "예측" }
      - { name: "Action", verb: "움직임" }
    note: "약 70 MB, 고가 GPU 없이 기기 안에서 작동"
    chunk: "한 번에 동작 16개"
    arm: { name: "로봇팔", model: "VPA" }
    drone: { name: "드론", model: "Aero-VPA" }

glance:
  id: "glance"
  title: "한눈에 보는 슬링에이아이"
  intro: "무엇을, 누구에게 팔고, 지금 어디까지 왔는지."
  rows:
    - k: "만드는 것"
      v: >-
        기계를 움직이는 AI 제어 소프트웨어입니다. 카메라 영상을 받아 다음 동작 16개를 한 번에
        만듭니다. 로봇팔에는 관절 명령(<strong>VPA</strong>), 드론에는 속도·방향 비행 명령(<strong>Aero-VPA</strong>)을 냅니다.
    - k: "고객"
      v: >-
        빠른 반응이 필요한 공장·물류센터·드론 운용사, 그리고 자사 제품에 작은 AI 두뇌를 넣고 싶은
        로봇·드론·칩 제조사입니다.
    - k: "수익 모델"
      v: >-
        현장 소프트웨어: 유료 PoC 후 연간 이용료, 가격은 아낀 인건비의 20%입니다. 기술 사용료:
        VPA를 넣어 판매하는 제품 1대당 로열티입니다.
    - k: "단계"
      v: >-
        시뮬레이션에서 작동하는 MVP이며 모델·코드·벤치마크 데이터를 공개했습니다. 현재 연구개발
        단계이며 첫 매출은 2027년 목표입니다.
    - k: "검증"
      v: "신용보증기금 혁신스타트업 협약보증 2억 원 선정(2026년 10월), 특허 등록 1건."
    - k: "회사"
      v: "슬링에이아이 주식회사, 2026년 2월 인천 설립. 대표이사 이연석 박사."

problem:
  id: "problem"
  title: "문제: 무겁고, 느리고, 제각각인 로봇 AI"
  intro: "요즘 로봇 AI는 본 것을 먼저 ‘말’로 바꾼 뒤, 거대 언어모델(LLM)로 생각하고 나서야 움직입니다."
  points:
    - title: "거대한 두뇌"
      text: "챗GPT 같은 4 GB 이상의 LLM을 쓰고, 고가 GPU가 꼭 필요합니다."
    - title: "느린 반응"
      text: "한 단어씩 계산하기 때문에 갑자기 나타난 장애물에 늦게 대응합니다."
    - title: "기기마다 따로 개발"
      text: "로봇팔과 드론의 AI가 제각각이고, 드론에는 큰 모델을 싣기도 어렵습니다."
  flow:
    - { name: "눈 (카메라)", lines: ["보기"] }
    - { name: "LLM (4 GB+)", lines: ["고가 GPU 필수", "한 단어씩 계산"], note: "여기서 느려짐", slow: true }
    - { name: "로봇·드론", lines: ["움직이기"], note: "반응이 늦음" }
  flow_label: "기존 방식: 카메라, 거대 언어모델, 기계 순서로 처리"
  caption: "기존 방식에서는 본 것을 ‘말’로 바꾸는 단계가 무겁고 느립니다."
  verdict: "느리고, 무겁고, 제각각이라는 점이 로봇·드론 현장 보급의 걸림돌입니다."

how:
  id: "how"
  title: "해결책: 보고, 예측하고, 바로 움직이는 VPA"
  intro: "VPA에는 ‘말’ 단계가 없습니다. 작은 신경망 4개가 차례로 돌고, 마지막 신경망이 이어지는 동작 전체를 한 번에 씁니다."
  input: { name: "카메라", sub: "로봇팔·드론 공통" }
  steps:
    - { mark: "V", name: "보기", term: "Vision", text: "영상에서 핵심만 요약" }
    - { mark: "", name: "고르기", term: "Choose", text: "할 일 선택" }
    - { mark: "P", name: "미리보기", term: "Predictor", text: "0.1초 뒤 상황 예측" }
    - { mark: "A", name: "움직이기", term: "Action", text: "동작 16개를 한 번에" }
  output: { title: "다음 동작 16개를 0.012초에", sub: "로봇팔 관절 · 드론 비행" }
  bracket: "‘말’ 단계 없이, 5번 계산으로 연속 동작 전체를 계획합니다."
  spec_title: "핵심 수치"
  spec:
    - k: "다음 동작 16개 계산"
      v: "0.012초, 눈 깜빡임의 1/10"
      note: "VPA, Apple M4 칩에서 측정"
    - k: "AI 크기"
      v: "약 70 MB, 노래 15곡 분량"
      note: "파라미터 1,813만 개 기준 (Aero-VPA)"
    - k: "4 GB급 LLM 로봇 AI 대비"
      v: "약 1/50 크기"
    - k: "결정 1번에 드는 계산"
      v: "동작 길이와 상관없이 항상 5번"
    - k: "작동 장소"
      v: "기기 안의 저전력 소형 보드"
      note: "Aero-VPA는 15 W급 NVIDIA Jetson Orin Nano용으로 설계"
    - k: "학습 환경"
      v: "Google Cloud GPU 가상머신 (NVIDIA L4)"
      note: "드론 비행 시뮬레이션(PX4·Gazebo)도 같은 환경에서 실행"
  example:
    title: "예) 드론이 숲을 지나 목적지로 갈 때"
    rows:
      - { k: "① 보기 (V)", v: "카메라로 앞의 나무 위치를 파악합니다." }
      - { k: "② 고르기", v: "할 일로 ‘나무 피해 전진’을 고릅니다." }
      - { k: "③ 미리보기 (P)", v: "0.1초 뒤 상황을 예측해 부딪힐 곳을 확인합니다." }
      - { k: "④ 움직이기 (A)", v: "속도·방향 비행 명령 16개를 한 번에 냅니다." }
      - { k: "안전장치", v: "지나온 나무를 15초 동안 기억하고, 너무 가까우면 감속하거나 후진합니다.", safe: true }
  footnote: "70 MB는 AI를 이루는 숫자(파라미터) 1,813만 개 기준입니다 (Aero-VPA). 로봇팔용 VPA도 2,000만 개 미만의 같은 크기급입니다."

